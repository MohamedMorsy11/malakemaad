<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ملك عماد 🐑✨</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            /* صورة خروف كرتون جودة عالية جداً وألوانها متناسقة */
            background: url('https://img.freepik.com/free-vector/hand-drawn-eid-al-adha-greeting-cards-with-sheep_23-2148554228.jpg') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .container {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            border: 4px solid #ffffff;
            max-width: 85%;
            width: 450px;
        }

        .site-name {
            font-size: 24px;
            color: #ff4081;
            font-weight: bold;
            margin-bottom: 15px;
            display: block;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        h1 { 
            color: #4a2c2a; 
            margin-bottom: 40px; 
            font-size: 26px; 
            line-height: 1.6;
            font-weight: 800;
        }

        .buttons-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            min-height: 100px;
            position: relative;
        }

        button {
            padding: 15px 35px;
            font-size: 20px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            min-width: 130px;
            box-shadow: 0 8px 15px rgba(0,0,0,0.2);
        }

        #yesBtn { 
            background: linear-gradient(135deg, #4CAF50, #2E7D32);
            color: white; 
        }
        
        #yesBtn:hover { 
            transform: translateY(-3px) scale(1.05); 
            box-shadow: 0 12px 20px rgba(76, 175, 80, 0.4);
        }

        #noBtn {
            background: linear-gradient(135deg, #f44336, #c62828);
            color: white;
            position: absolute;
            z-index: 999;
        }
    </style>
</head>
<body>

    <div class="container">
        <span class="site-name">🌸 ملك عماد 🌸</span>
        <h1>تقبلي تبقي خروف عيد الأضحى بتاعي السنة دي؟ 🐑🎁</h1>
        
        <div class="buttons-wrapper">
            <button id="yesBtn" onclick="celebrate()">أيوة طبعاً! 😍</button>
            <button id="noBtn" onmouseover="moveButton()" onclick="moveButton()">لأ 🏃‍♂️</button>
        </div>
    </div>

    <script>
        function celebrate() {
            // تأثير الزينة والاحتفالات
            const end = Date.now() + (7 * 1000);
            const colors = ['#ff4081', '#4CAF50', '#ffeb3b', '#2196f3'];

            (function frame() {
                confetti({
                    particleCount: 4,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 },
                    colors: colors
                });
                confetti({
                    particleCount: 4,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 },
                    colors: colors
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            }());

            setTimeout(() => {
                alert("يا روحي يا ملوكة! أحلى خروف في الدنيا.. كل سنة وأنتي منورة حياتي! ❤️🐑🎈");
            }, 500);
        }

        function moveButton() {
            const btn = document.getElementById('noBtn');
            // حساب المسافات عشان ميهربش بره الشاشة خالص
            const x = Math.random() * (window.innerWidth - btn.offsetWidth - 20);
            const y = Math.random() * (window.innerHeight - btn.offsetHeight - 20);
            
            btn.style.position = 'fixed';
            btn.style.left = x + 'px';
            btn.style.top = y + 'px';
        }
    </script>
</body>
</html>
