<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ملك عماد 🐑✨</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            /* صورة فيها بلالين واحتفال وألوان مبهجة جداً */
            background: url('https://img.freepik.com/free-vector/birthday-party-background-with-balloons-confetti_1017-31368.jpg') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        /* إضافة صورة خروف صغير بيتحرك كديكور */
        body::after {
            content: '🐑';
            position: absolute;
            bottom: 20px;
            right: 20px;
            font-size: 50px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            border: 6px solid #ffeb3b; /* برواز أصفر مبهج */
            max-width: 85%;
            width: 450px;
            position: relative;
            z-index: 2;
        }

        .site-name {
            font-size: 26px;
            color: #e91e63;
            font-weight: 900;
            margin-bottom: 15px;
            display: block;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        h1 { 
            color: #333; 
            margin-bottom: 40px; 
            font-size: 28px; 
            line-height: 1.4;
            font-weight: 800;
        }

        .buttons-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
            min-height: 100px;
            position: relative;
        }

        button {
            padding: 15px 35px;
            font-size: 20px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: bold;
            min-width: 140px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.2);
        }

        #yesBtn { 
            background: linear-gradient(45deg, #FF5252, #FF4081);
            color: white; 
        }
        
        #yesBtn:hover { 
            transform: scale(1.1) rotate(-3deg); 
        }

        #noBtn {
            background: #9e9e9e;
            color: white;
            position: absolute;
            z-index: 1000;
        }
    </style>
</head>
<body>

    <div class="container">
        <span class="site-name">🎈 ملك عماد 🎈</span>
        <h1>تقبلي تبقي خروف العيد بتاعي وبتاع قلبي؟ 🐑❤️</h1>
        
        <div class="buttons-wrapper">
            <button id="yesBtn" onclick="celebrate()">أيوة طبعاً! ✨</button>
            <button id="noBtn" onmouseover="moveButton()" onclick="moveButton()">لأ 🏃‍♀️</button>
        </div>
    </div>

    <script>
        function celebrate() {
            // انفجار بلالين وزينة في كل حتة
            var end = Date.now() + (10 * 1000);
            var colors = ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff', '#00ffff'];

            (function frame() {
                confetti({
                    particleCount: 7,
                    angle: 60,
                    spread: 80,
                    origin: { x: 0 },
                    colors: colors
                });
                confetti({
                    particleCount: 7,
                    angle: 120,
                    spread: 80,
                    origin: { x: 1 },
                    colors: colors
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            }());

            setTimeout(() => {
                alert("يا روحي يا ملوكة! العيد أحلى بيكي.. كل سنة وأنتي طيبة يا أحلى خروف في المجرة! 🎈🐑🥳");
            }, 500);
        }

        function moveButton() {
            const btn = document.getElementById('noBtn');
            // سرعة الهروب
            const x = Math.random() * (window.innerWidth - btn.offsetWidth - 50);
            const y = Math.random() * (window.innerHeight - btn.offsetHeight - 50);
            
            btn.style.position = 'fixed';
            btn.style.left = x + 'px';
            btn.style.top = y + 'px';
        }
    </script>
</body>
</html>
